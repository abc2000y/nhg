<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D 天体插剑互动游戏</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050510;
            font-family: sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* UI面板提示 */
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 20px;
            letter-spacing: 2px;
        }
        p {
            margin: 0;
            font-size: 14px;
            color: #a0c0ff;
        }
        /* 音频控制按钮 */
        #audio-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
            z-index: 10;
        }
        #audio-btn:active {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-overlay">
        <h1>星体拔剑</h1>
        <p>点击剑柄将其拔出，拖动屏幕旋转星球</p>
    </div>

    <button id="audio-btn">🔊 开启音效/BGM</button>
    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, planet, swordsGroup = [];
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let targetRotation = { x: 0, y: 0 };
        
        // 音频上下文与状态
        let audioCtx = null;
        let isAudioEnabled = false;

        init();
        animate();

        function init() {
            // 1. 场景容器
            const container = document.getElementById('canvas-container');
            
            // 2. 场景
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050510, 0.015);

            // 3. 相机 (适配手机屏幕，动态计算视场角与距离)
            const aspect = window.innerWidth / window.innerHeight;
            camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 1000);
            camera.position.z = window.innerWidth < 768 ? 16 : 13;

            // 4. 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // 5. 灯光
            const ambientLight = new THREE.AmbientLight(0x334466, 1.5);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 2);
            sunLight.position.set(15, 20, 15);
            sunLight.castShadow = true;
            scene.add(sunLight);

            const rimLight = new THREE.PointLight(0x4488ff, 3, 50);
            rimLight.position.set(-15, -10, -15);
            scene.add(rimLight);

            // 6. 创建天体球（多层材质与星际地表纹理感）
            createCelestialPlanet();

            // 7. 在球体表面插上多把剑
            createSwordsOnPlanet(36);

            // 8. 交互事件（支持触控与鼠标）
            initInteractions();

            // 9. 窗口尺寸自适应
            window.addEventListener('resize', onWindowResize);

            // 10. 音频按钮绑定
            document.getElementById('audio-btn').addEventListener('click', toggleAudio);
        }

        // 创建高级天体球
        function createCelestialPlanet() {
            const radius = 3.8;
            const geometry = new THREE.SphereGeometry(radius, 64, 64);

            // 使用自定义着色器或高级网格材质营造天体星球质感
            const material = new THREE.MeshStandardMaterial({
                color: 0x112244,
                roughness: 0.6,
                metalness: 0.4,
                bumpScale: 0.05,
            });

            planet = new THREE.Mesh(geometry, material);
            scene.add(planet);

            // 添加星球外围的发光大气层
            const atmosGeo = new THREE.SphereGeometry(radius * 1.08, 64, 64);
            const atmosMat = new THREE.ShaderMaterial({
                vertexShader: `
                    varying vec3 vNormal;
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec3 vNormal;
                    void main() {
                        float intensity = pow(0.6 - dot(vNormal, vec3(0, 0, 1.0)), 2.0);
                        gl_FragColor = vec4(0.2, 0.5, 1.0, 1.0) * intensity * 1.5;
                    }
                `,
                blending: THREE.AdditiveBlending,
                side: THREE.BackSide,
                transparent: true
            });
            const atmosphere = new THREE.Mesh(atmosGeo, atmosMat);
            planet.add(atmosphere);

            // 添加一层科技经纬网格线，使星球显得更立体密实
            const wireGeo = new THREE.SphereGeometry(radius * 1.002, 24, 24);
            const wireMat = new THREE.MeshBasicMaterial({
                color: 0x3388ff,
                wireframe: true,
                transparent: true,
                opacity: 0.15
            });
            const wireMesh = new THREE.Mesh(wireGeo, wireMat);
            planet.add(wireMesh);
        }

        // 创建精致的剑模型并插在球体表面
        function createSwordsOnPlanet(count) {
            const radius = 3.8;
            
            for (let i = 0; i < count; i++) {
                const swordGroup = new THREE.Group();

                // 剑身
                const bladeGeo = new THREE.BoxGeometry(0.08, 2.2, 0.04);
                const bladeMat = new THREE.MeshStandardMaterial({ color: 0xddeeff, metalness: 0.9, roughness: 0.1 });
                const blade = new THREE.Mesh(bladeGeo, bladeMat);
                blade.position.y = 1.1;
                blade.castShadow = true;
                swordGroup.add(blade);

                // 剑柄护手
                const guardGeo = new THREE.BoxGeometry(0.6, 0.08, 0.15);
                const goldMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.3 });
                const guard = new THREE.Mesh(guardGeo, goldMat);
                guard.position.y = 0.1;
                swordGroup.add(guard);

                // 剑柄
                const hiltGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.5, 16);
                const hiltMat = new THREE.MeshStandardMaterial({ color: 0x553311, roughness: 0.8 });
                const hilt = new THREE.Mesh(hiltGeo, hiltMat);
                hilt.position.y = 0.38;
                swordGroup.add(hilt);

                // 剑柄尾端宝石
                const pommelGeo = new THREE.SphereGeometry(0.08, 16, 16);
                const gemMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 0.5 });
                const pommel = new THREE.Mesh(pommelGeo, gemMat);
                pommel.position.y = 0.65;
                swordGroup.add(pommel);

                // 使用斐波那契球面分布算法，让剑在星球表面均匀插布
                const phi = Math.acos(-1 + (2 * i) / count);
                const theta = Math.sqrt(count * Math.PI) * phi;

                const x = radius * Math.sin(phi) * Math.cos(theta);
                const y = radius * Math.sin(phi) * Math.sin(theta);
                const z = radius * Math.cos(phi);

                swordGroup.position.set(x, y, z);

                // 让剑尖指向球心，垂直插在球面上
                swordGroup.lookAt(0, 0, 0);
                swordGroup.rotateX(Math.PI / 2);

                // 记录初始本地位置与状态，用于拔剑动画
                swordGroup.userData = {
                    id: i,
                    isPulled: false,
                    initialPosition: swordGroup.position.clone(),
                    initialQuaternion: swordGroup.quaternion.clone()
                };

                planet.add(swordGroup);
                swordsGroup.push(swordGroup);
            }
        }

        // 交互逻辑（拖动旋转星球 + 点击拔剑）
        function initInteractions() {
            const dom = renderer.domElement;

            dom.addEventListener('pointerdown', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            dom.addEventListener('pointermove', (e) => {
                if (!isDragging) return;

                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                targetRotation.y += deltaX * 0.005;
                targetRotation.x += deltaY * 0.005;

                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            dom.addEventListener('pointerup', (e) => {
                if (Math.abs(e.clientX - previousMousePosition.x) < 3 && Math.abs(e.clientY - previousMousePosition.y) < 3) {
                    checkSwordClick(e);
                }
                isDragging = false;
            });

            dom.addEventListener('pointercancel', () => { isDragging = false; });
        }

        // 检测点击哪把剑并触发拔出动画
        function checkSwordClick(e) {
            const mouse = new THREE.Vector2();
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);

            // 收集所有剑的网格
            const intersects = raycaster.intersectObjects(planet.children, true);

            if (intersects.length > 0) {
                let obj = intersects[0].object;
                // 向上寻找所属的剑分组
                while (obj.parent && obj.parent !== planet) {
                    obj = obj.parent;
                }
                if (swordsGroup.includes(obj) && !obj.userData.isPulled) {
                    pullSword(obj);
                    playSwordSound(); // 播放拔剑音效
                }
            }
        }

        // 拔剑动画
        function pullSword(sword) {
            sword.userData.isPulled = true;
            let progress = 0;
            const startPos = sword.position.clone();
            const pullDir = startPos.clone().normalize(); // 沿球心向外的法线方向拔出
            const targetPos = startPos.clone().add(pullDir.multiplyScalar(3.5));

            function animatePull() {
                progress += 0.04;
                if (progress <= 1) {
                    sword.position.lerpVectors(startPos, targetPos, easeOutCubic(progress));
                    sword.rotateZ(0.05); // 拔出时带有一点旋转
                    requestAnimationFrame(animatePull);
                } else {
                    // 拔出后淡出消失或停留
                    setTimeout(() => {
                        resetSword(sword);
                    }, 1500);
                }
            }
            animatePull();
        }

        function easeOutCubic(x) {
            return 1 - Math.pow(1 - x, 3);
        }

        // 剑飞回插回球体
        function resetSword(sword) {
            sword.position.copy(sword.userData.initialPosition);
            sword.quaternion.copy(sword.userData.initialQuaternion);
            sword.userData.isPulled = false;
        }

        // === 音效与BGM系统 (Web Audio API 动态合成，无需外部音频文件) ===
        function toggleAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            isAudioEnabled = !isAudioEnabled;
            const btn = document.getElementById('audio-btn');
            if (isAudioEnabled) {
                btn.innerText = "🔊 音效/BGM 已开启";
                startBGM();
            } else {
                btn.innerText = "🔇 点击开启音效/BGM";
                stopBGM();
            }
        }

        let bgmInterval = null;
        function startBGM() {
            if (bgmInterval) return;
            // 模拟太空环境音垫 (Ambient drone)
            bgmInterval = setInterval(() => {
                if (!isAudioEnabled || !audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(110 + Math.random() * 50, audioCtx.currentTime); // 低沉太空音
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 4);
            }, 3000);
        }

        function stopBgmInternal() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        function stopBGM() {
            stopBgmInternal();
        }

        // 拔剑金属音效合成
        function playSwordSound() {
            if (!isAudioEnabled || !audioCtx) return;
            
            const now = audioCtx.currentTime;
            
            // 金属高频震荡
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(200, now + 0.4);
            
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start(now);
            osc.stop(now + 0.4);
        }

        // 屏幕自适应
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            if (window.innerWidth < 768) {
                camera.position.z = 16; // 手机上稍微拉远一点点确保不溢出屏幕
            } else {
                camera.position.z = 13;
            }
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);

            // 行星缓慢自转
            planet.rotation.y += 0.002;

            // 平滑惯性旋转跟随触摸/鼠标
            planet.rotation.y += (targetRotation.y - planet.rotation.y) * 0.05;
            planet.rotation.x += (targetRotation.x - planet.rotation.x) * 0.05;
            
            // 限制上下旋转角度，防止翻转过头
            planet.rotation.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, planet.rotation.x));

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
